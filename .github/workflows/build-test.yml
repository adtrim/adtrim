name: Build and test
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AdTrim.sln
      - run: dotnet build AdTrim.sln --no-restore -m:1 --configuration Release
      - run: dotnet test tests/AdTrim.Tests/AdTrim.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: tests/AdTrim.Tests/TestResults/*.trx
