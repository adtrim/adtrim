name: Build and test
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AdTrim.sln
      - run: dotnet build AdTrim.sln --no-restore -m:1 --configuration Release
      - run: dotnet test tests/AdTrim.Tests/AdTrim.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: tests/AdTrim.Tests/TestResults/*.trx
